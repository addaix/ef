[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ef"
version = "0.1.30"
description = "Embeddings Flow -- Tools for workflows involving semantic embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "embeddings",
    "rag",
    "retrieval",
    "segmentation",
    "corpus",
    "vector-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "numpy",
    "dol>=0.3.31",
    "i2>=0.1.63",
    "vd>=0.2.0",
]

[project.urls]
Homepage = "https://addaix.github.io/ef/"
Repository = "https://github.com/addaix/ef"
Issues = "https://github.com/addaix/ef/issues"
Changelog = "https://github.com/addaix/ef/blob/main/CHANGELOG.md"

[project.optional-dependencies]
imbed = [
    "imbed>=0.0.23",
]
explore = [
    "umap-learn>=0.5",
    "hdbscan>=0.8.33",
]
openai = [
    "openai>=1.0",
]
sentence-transformers = [
    "sentence-transformers>=2.4",  # encode(prompt=, prompt_name=); util.get_device_name
]
rust = [
    "ef-rust",  # native kernel for HashingEmbedder(backend="rust"): a separate wheel, see rust/
    "numpy>=2",  # the kernel reproduces numpy 2's float32 rounding (NEP 50)
]
testing = [
    "pytest",
]

[tool.hatch.build.targets.sdist]
# rust/ is the separate ef-rust package (its own maturin build): it ships from the
# repository, not in ef's pure-Python sdist
exclude = [
    "rust/",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
